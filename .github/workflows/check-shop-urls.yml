name: Check shop URLs

on:
  schedule:
    - cron: '0 18 * * *' # 毎日 JST 3:00
  workflow_dispatch:

# 権限はジョブごとに必要な分だけ与える。
permissions: {}

jobs:
  # 外部のスプレッドシートを解析し、任意のURLへアクセスするジョブ。
  # リポジトリへの書き込み権限は持たせず、結果はartifactとして次のジョブへ渡す。
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # 外部データを扱うジョブなので、依存パッケージのキャッシュは使わない。
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      - run: npm run check-shop-urls

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shop-status
          path: data/shop-status.json
          if-no-files-found: error
          retention-days: 1

  # 巡回結果を検証したうえでコミットするジョブ。依存パッケージの取得や外部データの解析は行わない。
  commit:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shop-status
          path: ${{ runner.temp }}/shop-status

      - name: Validate shop status
        run: node scripts/validate-shop-status.mjs "$RUNNER_TEMP/shop-status/shop-status.json"

      - name: Commit updated shop status
        run: |
          cp "$RUNNER_TEMP/shop-status/shop-status.json" data/shop-status.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/shop-status.json
          git diff --cached --quiet || git commit -m "chore: update shop URL status"
          git push
