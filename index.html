<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ゆらのゆるっとゆらっとTeaTime</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.sheetjs.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' https://i.ytimg.com; connect-src 'self' https://docs.google.com https://*.googleusercontent.com; frame-src https://www.youtube.com; object-src 'none'; base-uri 'self';"
    />
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=League+Script&family=Noto+Sans+JP&family=Zen+Kurenaido&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="splash-screen" class="splash-screen" role="status" aria-live="polite">
      <img class="splash-logo" src="img/title-logo.svg" alt="読み込み中" />
    </div>

    <div class="page">
      <main class="content">
        <section class="map-panel" aria-label="地図">
          <div id="map">
            <div id="map-svg">
              <h1 class="page-title" aria-label="ゆらのゆるっとゆらっとTeaTime">
                <img class="title-logo" src="img/title-logo.svg" alt="" aria-hidden="true" />
              </h1>
            </div>
          </div>
        </section>

        <aside class="info-panel" aria-live="polite">
          <h2 id="selected-heading"></h2>
          <div class="selected-box">
            <div id="selected-video" class="selected-video" aria-label="配信"></div>
          </div>
          <div id="selected-details" class="selected-details" aria-live="polite">
          </div>
        </aside>
      </main>

      <div id="back-to-map-panel" class="back-to-map-panel">
        <button type="button" id="back-to-map-button" class="back-to-map-button">
          <img class="back-to-map-icon" src="img/back-to-map.svg" alt="" aria-hidden="true" />
          <span>地図に戻る</span>
        </button>
      </div>

      <footer class="license-notice">
        <small>
            Create: <a href="https://x.com/o2i_5" target="_blank" rel="noopener noreferrer">@o2i_5</a> /
            Data: <a href="https://x.com/Shigure_1764" target="_blank" rel="noopener noreferrer">@Shigure_1764</a> /
            Map SVG: <a href="https://github.com/geolonia/japanese-prefectures" target="_blank" rel="noopener noreferrer">Geolonia Japanese Prefectures</a>
        </small>
      </footer>
    </div>

    <script
      src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"
      integrity="sha384-EnyY0/GSHQGSxSgMwaIPzSESbqoOLSexfnSMN2AP+39Ckmn92stwABZynq1JyzdT"
      crossorigin="anonymous"
    ></script>
    <script src="js/script.js?v=splash-screen-1"></script>
  </body>
</html>
